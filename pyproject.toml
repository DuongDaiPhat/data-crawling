[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "edu-social-crawler"
version = "0.1.0"
description = "CLI thu thap du lieu giao duc cong khai tu Facebook Pages, Threads va Reddit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gspread>=6.1,<7",
  "google-auth>=2.35,<3",
  "praw>=7.8,<8",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3",
  "rich>=13.9,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.7,<1",
]

[project.scripts]
edu-crawl = "edu_social_crawler.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/edu_social_crawler"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
